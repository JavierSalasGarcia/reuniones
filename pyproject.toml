[project]
name = "reuniones"
version = "0.1.0"
description = "Expedientes de reuniones con reconocimiento facial, minutas y busqueda local"
requires-python = ">=3.11"

[project.scripts]
reunion = "reuniones.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reuniones*"]

[tool.setuptools.package-data]
reuniones = ["esquema.sql", "web/plantillas/*.html", "web/estaticos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
